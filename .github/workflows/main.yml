name: Build Clipboard Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install FAST
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/Fast"

          echo "===== GET FAST RELEASE ====="

          RELEASE_JSON=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jewelshkjony/fast-cli/releases/latest)

          echo "$RELEASE_JSON" > /tmp/fast-release.json

          FAST_URL=$(python3 - <<'PY'
          import json

          with open("/tmp/fast-release.json") as f:
              data = json.load(f)

          assets = data.get("assets", [])

          for asset in assets:
              name = asset.get("name", "")
              url = asset.get("browser_download_url", "")

              if name.lower().endswith(".zip"):
                  print(url)
                  break
          else:
              raise SystemExit("No ZIP asset found in FAST release")
          PY
          )

          echo "FAST URL:"
          echo "$FAST_URL"

          curl -fL "$FAST_URL" -o "$HOME/Fast/Fast.zip"

          echo "===== FAST ZIP ====="
          unzip -l "$HOME/Fast/Fast.zip"

          unzip -o "$HOME/Fast/Fast.zip" -d "$HOME/Fast"

          echo "===== FAST FILES ====="
          find "$HOME/Fast" -maxdepth 3 -type f -print

          FAST_JAR=$(find "$HOME/Fast" -type f -name "fast.jar" | head -n 1)

          if [ -z "$FAST_JAR" ]; then
            echo "ERROR: fast.jar was not found!"
            exit 1
          fi

          mkdir -p "$HOME/Fast/bin"

          cp "$FAST_JAR" "$HOME/Fast/fast.jar"

          echo "FAST JAR:"
          ls -lh "$HOME/Fast/fast.jar"

      - name: Extract Extension
        shell: bash
        run: |
          set -e

          unzip -o ClipboardBridge_v2_Final.zip

          echo "===== EXTRACTED PROJECT ====="
          find ClipboardBridge_Final -maxdepth 6 -type f -print | sort

      - name: Prepare FAST Project
        shell: bash
        run: |
          set -e

          cd ClipboardBridge_Final

          mkdir -p src

          if [ -f AndroidManifest.xml ]; then
            mv AndroidManifest.xml src/AndroidManifest.xml
          fi

          if [ -d res ]; then
            mv res src/res
          fi

          cat > fast.yml <<'EOF'
          author: FAST
          min_sdk: 14
          compile_sdk: 35
          desugar_dex: true
          proguard: false
          R8: false
          gen_docs: false
          EOF

          echo "===== FAST PROJECT ====="
          find . -maxdepth 7 -type f -print | sort

          echo "===== FAST CONFIG ====="
          cat fast.yml

      - name: Sync Extension
        shell: bash
        run: |
          set -e

          cd ClipboardBridge_Final

          java -jar "$HOME/Fast/fast.jar" sync

      - name: Build Extension
        shell: bash
        run: |
          set -e

          cd ClipboardBridge_Final

          java -jar "$HOME/Fast/fast.jar" build

      - name: Find AIX
        shell: bash
        run: |
          echo "===== SEARCHING FOR AIX ====="

          find . -type f -name "*.aix" -print

          echo "===== OUT DIRECTORY ====="

          if [ -d ClipboardBridge_Final/out ]; then
            find ClipboardBridge_Final/out -maxdepth 3 -type f -print
          else
            echo "out directory not found"
          fi

      - name: Check AIX
        shell: bash
        run: |
          AIX_COUNT=$(find . -type f -name "*.aix" | wc -l)

          echo "AIX COUNT: $AIX_COUNT"

          if [ "$AIX_COUNT" -eq 0 ]; then
            echo "ERROR: No AIX file was created!"
            exit 1
          fi

      - name: Upload AIX
        uses: actions/upload-artifact@v4
        with:
          name: ClipboardBridge-AIX
          path: |
            **/*.aix
          if-no-files-found: error
