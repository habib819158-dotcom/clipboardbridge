name: Build Clipboard Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install FAST
        run: |
          curl -fsSL https://raw.githubusercontent.com/jewelshkjony/fast-cli/main/scripts/install/install.sh | bash

      - name: Extract Extension
        run: |
          unzip -o ClipboardBridge_v2_Final.zip

      - name: Prepare FAST Project
        run: |
          cd ClipboardBridge_Final

          mkdir -p src

          if [ -f AndroidManifest.xml ]; then
            mv AndroidManifest.xml src/AndroidManifest.xml
          fi

          if [ -d res ]; then
            mv res src/res
          fi

          cat > fast.yml <<'EOF'
          author: FAST
          min_sdk: 14
          compile_sdk: 35
          desugar_dex: true
          proguard: false
          R8: false
          gen_docs: false
          EOF

          echo "===== PROJECT STRUCTURE ====="
          find . -maxdepth 5 -type f | sort

      - name: Sync Extension
        run: |
          cd ClipboardBridge_Final
          java -jar "$HOME/Fast/fast.jar" sync

      - name: Build Extension
        run: |
          cd ClipboardBridge_Final
          java -jar "$HOME/Fast/fast.jar" build

      - name: Find AIX
        run: |
          echo "===== AIX FILES ====="
          find . -type f -name "*.aix" -print
          echo "===== OUT DIRECTORY ====="
          find ClipboardBridge_Final/out -maxdepth 2 -type f -print 2>/dev/null || true

      - name: Upload AIX
        uses: actions/upload-artifact@v4
        with:
          name: ClipboardBridge-AIX
          path: |
            **/*.aix
          if-no-files-found: error
