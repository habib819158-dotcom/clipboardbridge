name: Build Clipboard Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install FAST
        run: |
          curl -fsSL https://raw.githubusercontent.com/jewelshkjony/fast-cli/main/scripts/install/install.sh | bash

      - name: Extract Extension
        run: |
          unzip -o ClipboardBridge_v2_Final.zip

      - name: Prepare Extension
        run: |
          cd ClipboardBridge_Final
          java -jar "$HOME/Fast/fast.jar" migrate ai2 .

      - name: Sync Extension
        run: |
          cd ClipboardBridge_Final
          java -jar "$HOME/Fast/fast.jar" sync

      - name: Build Extension
        run: |
          cd ClipboardBridge_Final
          java -jar "$HOME/Fast/fast.jar" build

      - name: Find AIX
        run: |
          echo "===== AIX FILES ====="
          find . -type f -name "*.aix" -print
          echo "===== ALL OUTPUT FILES ====="
          find ClipboardBridge_Final -maxdepth 4 -type f | sort

      - name: Upload AIX
        uses: actions/upload-artifact@v4
        with:
          name: ClipboardBridge-AIX
          path: |
            **/*.aix
          if-no-files-found: error
