name: Build Clipboard Extension

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================
      # 1. CHECKOUT
      # =========================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================
      # 2. SETUP JAVA
      # =========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =========================================
      # 3. INSTALL FAST
      # =========================================
      - name: Install FAST
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/Fast"

          echo "========================================="
          echo "GET FAST RELEASE"
          echo "========================================="

          RELEASE_JSON=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jewelshkjony/fast-cli/releases/latest)

          echo "$RELEASE_JSON" > /tmp/fast-release.json

          FAST_URL=$(python3 - <<'PY'
          import json

          with open("/tmp/fast-release.json", "r") as f:
              data = json.load(f)

          for asset in data.get("assets", []):
              name = asset.get("name", "")
              url = asset.get("browser_download_url", "")

              if name.lower().endswith(".zip"):
                  print(url)
                  break
          else:
              raise SystemExit(
                  "ERROR: No ZIP asset found in FAST release"
              )
          PY
          )

          echo "FAST URL:"
          echo "$FAST_URL"

          echo "========================================="
          echo "DOWNLOAD FAST"
          echo "========================================="

          curl -fL "$FAST_URL" \
            -o "$HOME/Fast/Fast.zip"

          echo "========================================="
          echo "EXTRACT FAST"
          echo "========================================="

          unzip -o "$HOME/Fast/Fast.zip" \
            -d "$HOME/Fast"

          echo "========================================="
          echo "FIND FAST JAR"
          echo "========================================="

          FAST_JAR=$(find "$HOME/Fast" \
            -type f \
            -name "fast.jar" \
            | head -n 1)

          if [ -z "$FAST_JAR" ]; then
            echo "ERROR: fast.jar not found!"
            exit 1
          fi

          echo "FAST JAR:"
          echo "$FAST_JAR"


      # =========================================
      # 4. EXTRACT EXTENSION
      # =========================================
      - name: Extract Extension
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "EXTRACT CLIPBOARD EXTENSION"
          echo "========================================="

          unzip -o ClipboardBridge_v2_Final.zip

          echo "========================================="
          echo "PROJECT FILES"
          echo "========================================="

          find ClipboardBridge_Final \
            -maxdepth 8 \
            -type f \
            -print \
            | sort


      # =========================================
      # 5. PREPARE FAST PROJECT
      # =========================================
      - name: Prepare FAST Project
        shell: bash
        run: |
          set -e

          cd ClipboardBridge_Final

          echo "========================================="
          echo "CREATE DIRECTORIES"
          echo "========================================="

          mkdir -p src
          mkdir -p assets
          mkdir -p assets/images


          # =========================================
          # CREATE EXTENSION ICON
          # =========================================
          echo "========================================="
          echo "CREATE EXTENSION ICON"
          echo "========================================="

          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=" \
            | base64 -d \
            > assets/images/extension.png

          if [ ! -f assets/images/extension.png ]; then
            echo "ERROR: extension.png was not created!"
            exit 1
          fi

          echo "ICON CREATED:"
          ls -lh assets/images/extension.png


          # =========================================
          # MOVE MANIFEST
          # =========================================
          echo "========================================="
          echo "MOVE ANDROID MANIFEST"
          echo "========================================="

          if [ -f AndroidManifest.xml ]; then
            mv AndroidManifest.xml src/AndroidManifest.xml
          fi


          # =========================================
          # MOVE RESOURCES
          # =========================================
          echo "========================================="
          echo "MOVE RESOURCES"
          echo "========================================="

          if [ -d res ]; then
            mv res src/res
          fi


          # =========================================
          # FIX MANIFEST
          # =========================================
          echo "========================================="
          echo "FIX ANDROID MANIFEST"
          echo "========================================="

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("src/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit(
                  "ERROR: AndroidManifest.xml not found!"
              )

          text = manifest.read_text()

          package_name = "com.example.clipboardbridge"

          if "package=" not in text:
              text = text.replace(
                  "<manifest",
                  '<manifest package="' +
                  package_name +
                  '"',
                  1
              )

          manifest.write_text(text)

          print("===== FINAL MANIFEST =====")
          print(manifest.read_text())
          PY


          # =========================================
          # FIX JAVA ANNOTATIONS
          # =========================================
          echo "========================================="
          echo "FIX JAVA ANNOTATIONS"
          echo "========================================="

          python3 - <<'PY'
          from pathlib import Path

          java = Path(
              "src/com/example/clipboardbridge/ClipboardBridge.java"
          )

          if not java.exists():
              raise SystemExit(
                  "ERROR: ClipboardBridge.java not found!"
              )

          text = java.read_text()


          # Remove old SimpleObject import
          text = text.replace(
              "import com.google.appinventor.components.annotations.SimpleObject;",
              ""
          )


          # Remove old SimpleObject annotation
          text = text.replace(
              "@SimpleObject(external = true)",
              ""
          )


          # Remove Component import from previous attempt
          text = text.replace(
              "import com.google.appinventor.components.annotations.Component;",
              ""
          )


          # Remove invalid Component annotation
          text = text.replace(
              "@Component(external = true)",
              ""
          )


          java.write_text(text)

          print("===== FINAL JAVA SOURCE =====")
          print(java.read_text())
          PY


          # =========================================
          # CREATE FAST.YML
          # =========================================
          echo "========================================="
          echo "CREATE FAST.YML"
          echo "========================================="

          cat > fast.yml <<'EOF'
          author: FAST
          min_sdk: 14
          compile_sdk: 35
          desugar_dex: true
          proguard: false
          R8: false
          gen_docs: false
          EOF

          echo "===== FAST.YML ====="
          cat fast.yml


          # =========================================
          # CHECK ASSETS
          # =========================================
          echo "========================================="
          echo "CHECK ASSETS"
          echo "========================================="

          find assets \
            -type f \
            -print \
            | sort


          # =========================================
          # FINAL PROJECT
          # =========================================
          echo "========================================="
          echo "FINAL FAST PROJECT"
          echo "========================================="

          find . \
            -maxdepth 8 \
            -type f \
            -print \
            | sort


      # =========================================
      # 6. SYNC EXTENSION
      # =========================================
      - name: Sync Extension
        shell: bash
        run: |
          set -e

          cd ClipboardBridge_Final

          FAST_JAR=$(find "$HOME/Fast" \
            -type f \
            -name "fast.jar" \
            | head -n 1)

          if [ -z "$FAST_JAR" ]; then
            echo "ERROR: fast.jar not found!"
            exit 1
          fi

          echo "========================================="
          echo "FAST SYNC"
          echo "========================================="

          echo "Using FAST:"
          echo "$FAST_JAR"

          java -jar "$FAST_JAR" sync


      # =========================================
      # 7. BUILD EXTENSION
      # =========================================
      - name: Build Extension
        shell: bash
        run: |
          set -o pipefail

          cd ClipboardBridge_Final

          FAST_JAR=$(find "$HOME/Fast" \
            -type f \
            -name "fast.jar" \
            | head -n 1)

          if [ -z "$FAST_JAR" ]; then
            echo "ERROR: fast.jar not found!"
            exit 1
          fi

          echo "========================================="
          echo "FAST BUILD"
          echo "========================================="

          java -jar "$FAST_JAR" build 2>&1 | tee build.log

          echo "========================================="
          echo "CHECK BUILD RESULT"
          echo "========================================="

          if grep -q "BUILD FAILED" build.log; then
            echo "ERROR: FAST BUILD FAILED!"
            exit 1
          fi

          if grep -q "error:" build.log; then
            echo "ERROR: Java compilation error detected!"
            exit 1
          fi

          echo "FAST BUILD COMMAND FINISHED."


      # =========================================
      # 8. FIND AIX
      # =========================================
      - name: Find AIX
        shell: bash
        run: |
          echo "========================================="
          echo "SEARCH FOR AIX"
          echo "========================================="

          find . \
            -type f \
            -name "*.aix" \
            -print

          echo "========================================="
          echo "OUT DIRECTORY"
          echo "========================================="

          if [ -d ClipboardBridge_Final/out ]; then

            find ClipboardBridge_Final/out \
              -maxdepth 5 \
              -type f \
              -print

          else

            echo "out directory not found."

          fi


      # =========================================
      # 9. CHECK AIX
      # =========================================
      - name: Check AIX
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "CHECK AIX"
          echo "========================================="

          AIX_COUNT=$(find . \
            -type f \
            -name "*.aix" \
            | wc -l)

          echo "AIX COUNT: $AIX_COUNT"

          if [ "$AIX_COUNT" -eq 0 ]; then

            echo "ERROR: No AIX file was created!"

            echo ""
            echo "========================================="
            echo "BUILD LOG"
            echo "========================================="

            if [ -f ClipboardBridge_Final/build.log ]; then
              cat ClipboardBridge_Final/build.log
            fi

            exit 1
          fi

          echo ""
          echo "SUCCESS!"
          echo "AIX file was created."


      # =========================================
      # 10. UPLOAD AIX
      # =========================================
      - name: Upload AIX
        uses: actions/upload-artifact@v4
        with:
          name: ClipboardBridge-AIX
          path: |
            **/*.aix
          if-no-files-found: error
